# /etc/nginx/sites-available/innsafleet
# Después: sudo ln -s /etc/nginx/sites-available/innsafleet /etc/nginx/sites-enabled/
#          sudo certbot --nginx -d innsafleet.com -d www.innsafleet.com
# certbot agrega solo el bloque 443 y la redirección de http a https.

server {
    listen 80;
    listen [::]:80;
    server_name innsafleet.com www.innsafleet.com;

    # Fotos del checklist: la app acepta hasta 5 MB
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Obligatorio: la app compara el Origin con el Host para aceptar POST/PUT/DELETE
        proxy_set_header Host              $host;
        # Obligatorio: con SESSION_SECURE=true la cookie solo sale si sabe que es HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_read_timeout 60s;
    }
}
